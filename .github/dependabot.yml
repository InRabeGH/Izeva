version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 5
      groups:
          next:
              patterns:
                  - 'next'
                  - '@next/*'
                  - 'react'
                  - 'react-dom'
                  - '@types/react*'
          drizzle:
              patterns:
                  - 'drizzle-orm'
                  - 'drizzle-kit'
                  - '@neondatabase/*'
          auth:
              patterns:
                  - 'better-auth'
                  - '@better-auth/*'
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/*'
                  - 'tw-animate-css'
      commit-message:
          prefix: 'chore(deps)'
          include: 'scope'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      commit-message:
          prefix: 'chore(ci)'
