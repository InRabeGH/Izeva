name: Bug report
description: Reportar un comportamiento inesperado
title: 'fix: '
labels: ['bug']
body:
    - type: textarea
      id: what-happened
      attributes:
          label: ¿Qué pasó?
          description: Descripción clara del problema.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Pasos para reproducir
          placeholder: |
              1. Ir a '...'
              2. Hacer click en '...'
              3. Ver error
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Comportamiento esperado
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Entorno
          placeholder: |
              - OS:
              - Navegador:
              - Versión:
    - type: textarea
      id: logs
      attributes:
          label: Logs / capturas
          render: shell
