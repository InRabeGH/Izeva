commit-msg:
    jobs:
        - name: commitlint
          run: bunx --bun commitlint --edit {1}

pre-commit:
    parallel: true
    jobs:
        - name: biome
          glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,css}'
          run: bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
          stage_fixed: true

pre-push:
    parallel: true
    jobs:
        - name: typecheck
          run: bun run typecheck
        - name: unit-tests
          run: bun test tests/lib
